# Measure the real robot and fill in. null = not measured yet; load_vehicle_params() refuses to run.
# Only the values the chosen drive uses must be filled: differential needs track_width_mm + max_speed_mps;
# ackermann needs wheel_base_mm + max_steer_deg + max_speed_mps.
# !! SWITCHING TO `final` CHANGES WHAT IS REQUIRED: ackermann ignores track_width_mm and
# !! needs wheel_base_mm + max_steer_deg measured instead (both still null here).
drive: differential    # "differential" (prototype: 4 driven wheels) or "ackermann" (final: servo steering)
wheel_base_mm: null    # front axle center to rear axle center (final only)
track_width_mm: 250    # PROTOTYPE measurement (user, 9 Nov 2026). Re-measure for final.
max_steer_deg: null    # servo steering limit at the wheels (final only)
max_speed_mps: 0.3     # safety ceiling, not a measurement. Start low and raise after testing
