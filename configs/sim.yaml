profile: sim
camera: { source: sim }
actuator: { type: sim }
model: { path: models/prototype/ }
debug: { enabled: true }
network: { enabled: true }

# Closed-loop synthetic run: scripts/run.sh sim [scenario] [--steps N] [--overlay out.mp4]
sim:
  scenario: straight
  dt: 0.05
  max_steps: 1200
  seed: 0
  overlay: null

  # Web dashboard (viewer + control channel). Starts only when asked for:
  # `--dashboard` on the command line, or enabled: true here. The final
  # profile has no such section, so it can never start a server there.
  # Open http://127.0.0.1:8000 while the sim runs.
  dashboard:
    enabled: false
    host: 127.0.0.1
    port: 8001
    realtime: true

# New cross-profile web dashboard (sim, prototype, final). Starts only when
# explicitly asked for (--dashboard flag) or enabled: true here.
# The old sim dashboard stays under sim.dashboard. The final profile never
# starts any dashboard unless explicitly requested.
dashboard:
  enabled: false
  host: 127.0.0.1
  port: 8000
  realtime: true
# Reference only: the sim runner derives its own LaneConfig from WorldConfig
# (the synthetic camera's geometry), so this section is never read by a sim
# run. It documents the shape the real profiles use.
lane:
  px_per_m: 130.0
  bottom_row_m: 0.3
  roi_top: 0.65
  max_band_span_m: 0.8
# No `checkpoint:` section on purpose: the sim's cross-line hue bands come from
# the colours the scenario renders (mav.sim.runner._sim_checkpoint_cfg), not
# from config. On the real robot they come from configs/ [A11].
