; KSTI MAV prototype firmware: 4 motors on 2x L298N, skid steering
; (speaks "W left right" in m/s).
; Board: Arduino **Nano** ATmega328P + 2x L298N (docs/hardware.md, 10 Nov 2026).
;
;   pio run            # compile
;   pio run -t upload  # flash (add --upload-port when several ports exist)
;   pio device monitor # serial monitor at 115200
;
; The shared core (protocol.md parser + watchdog + m/s->PWM) lives in
; ../lib/MavCore and is found via lib_extra_dirs. Requires: pip install platformio.
;
; BOARD/BUILD: this was `board = uno` until 10 Nov 2026. The robot has a Nano.
; If `pio run -t upload` fails with a sync timeout, the Nano has the OLD
; bootloader (57600 baud): switch to `board = nanoatmega328`. Both boards are
; ATmega328P with the same 30 KB flash / 2 KB RAM, so only the upload changes.
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_extra_dirs = ../lib
monitor_speed = 115200
