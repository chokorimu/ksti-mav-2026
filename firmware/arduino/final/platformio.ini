; KSTI MAV final firmware: 1 rear motor + 1 steering servo (speaks "D steer speed").
; Board: Arduino Uno + L298N (docs/hardware.md, confirmed 7 Nov 2026).
; The servo range constants are still TODO(Q1) - see src/final.ino.
;
;   pio run            # compile
;   pio run -t upload  # flash (add --upload-port when several ports exist)
;   pio device monitor # serial monitor at 115200
;
; The shared core (protocol.md parser + watchdog) lives in ../lib/MavCore and
; is found via lib_extra_dirs. Requires: pip install platformio.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_extra_dirs = ../lib
lib_deps = servo@1.3.0
monitor_speed = 115200
